<!doctype html>
<html lang="en" style="overflow: hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NK</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./scripts/page-version.js" type="module"></script>
  </head>

  <body>
    <main class="dashboard-content">
      <!-- Neovim ASCII Art Header -->
      <span class="main-banner">
        <img src="./res/under.svg" class="banner-content" />
        <img src="./res/construction.svg" class="banner-content" />
      </span>
      <h1 class="panel-header">
        <span><strong class="tag-ok">Nikola Kisiov</strong></span>
        <span><strong id="site-version" class="tag-ver">v0.10.0</strong></span>
      </h1>

      <!-- Footer Motto -->
      <p class="dashboard-footer-msg">"Website coming soon!"</p>
    </main>
    <!-- </div> -->

    <!-- Statusline -->
    <footer class="nvim-statusline">
      <div class="status-left">
        <div class="mode-pill">NORMAL</div>
        <div class="git-branch">
          <span style="color: var(--nvim-fg-normal)">index.html</span>
        </div>
        <div class="file-status"></div>
      </div>

      <div class="status-right">
        <div class="lsp-status"></div>
        <div class="file-encoding">unix</div>
        <div class="cursor-pos">1:1 (Top)</div>
      </div>
    </footer>
  </body>
</html>
