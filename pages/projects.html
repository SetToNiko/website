<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nikola Kisiov</title>
    <link rel="stylesheet" href="../style.css?v0.5.2" />
  </head>
  <body>
    <main class="dashboard-content">
      <div class="dashboard-section">
        <h1 class="panel-header">Projects</h1>
      </div>

      <div class="action-panel-topnav">
        <a href="/" class="action-item" draggable="false">
          <div class="label-group">
            <span class="prefix">type</span>
            <span class="command">
              <span class="leader">:</span>
              <span class="action">home</span>
              <span class="leader">&lt;Enter&gt;</span>
            </span>
          </div>
          <span class="label-desc">to return home</span>
        </a>
      </div>
    </main>
    <!-- Statusline -->
    <footer class="nvim-statusline">
      <div class="status-left">
        <div class="mode-pill">NORMAL</div>
        <div class="git-branch">
          <span style="color: var(--nvim-fg-normal)">projects.html</span>
        </div>
        <div class="file-status"></div>
      </div>

      <div class="status-right">
        <div class="lsp-status"></div>
        <div class="file-encoding">unix</div>
        <div class="cursor-pos">1:1 (Top)</div>
      </div>
    </footer>
  </body>
</html>
